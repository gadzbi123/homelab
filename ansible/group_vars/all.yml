---
# Override these in host_vars/<hostname>.yml or with -e key=value.
pixel_frame_user: "{{ ansible_user }}"
pixel_frame_repo: https://github.com/gadzbi123/pixel-frame.git
pixel_frame_version: animated
pixel_frame_install_dir: "/home/{{ pixel_frame_user }}/pixel-frame"
pixel_frame_device: /dev/fb0
pixel_frame_fps: 8
pixel_frame_start_scene: woodland
pixel_frame_seconds_per_scene: 720
pixel_frame_day_seconds: 120

# A dedicated frame needs a logged-in virtual console so the unprivileged
# service can hide/restore its cursor. Disable this on a shared machine.
pixel_frame_console_autologin: true
pixel_frame_console: tty1

# Readable text on a directly connected 1080p display.
console_font_face: Terminus
console_font_size: 16x32

# Tailscale. Put the auth key in Ansible Vault or pass it with -e; it is never
# committed to this repository. Leave empty to preserve an existing login.
tailscale_enabled: true
tailscale_hostname: "{{ inventory_hostname }}"
tailscale_auth_key: ""
tailscale_accept_routes: false

# T3 Code is installed by its own installer. The playbook owns its persistent
# user service and verifies the installed binary path.
t3code_enabled: true
t3code_binary: "{{ pixel_frame_home | default('/home/' ~ pixel_frame_user) }}/.t3/runtime/versions/0.0.42/t3"
t3code_home: "{{ pixel_frame_home | default('/home/' ~ pixel_frame_user) }}/.t3"

# Codex app-server health supervision. Codex is installed by its own installer;
# Ansible manages the recovery timer only.
codex_enabled: true
codex_binary: "{{ pixel_frame_home | default('/home/' ~ pixel_frame_user) }}/.local/bin/codex"

# The framebuffer renderer scales to the detected monitor resolution. An
# optional command can force a platform-specific mode (for example an xrandr
# command on a desktop); empty means detect and report only.
monitor_resize_command: ""
